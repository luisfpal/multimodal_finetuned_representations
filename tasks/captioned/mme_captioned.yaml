# MME — Captioned variant (text descriptions replace images)
#
# Dataset: l11p/MME-test-captioned (same as lmms-lab/MME + "caption" field)
# Scoring: Identical to original MME (perception + cognition scores)

dataset_path: l11p/MME-test-captioned
dataset_kwargs:
  token: True
task: "mme_captioned"
test_split: train
output_type: generate_until
process_docs: !function utils.mme_sort_by_question_id
doc_to_visual: !function utils.captioned_doc_to_visual
doc_to_text: !function utils.mme_captioned_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.mme_process_results
metric_list:
  - metric: mme_perception_score
    aggregation: !function utils.mme_aggregate_results
    higher_is_better: true
  - metric: mme_cognition_score
    aggregation: !function utils.mme_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer the question using a single word or phrase."
  gpt4v:
    pre_prompt: ""
    post_prompt: "\nAnswer the question with Yes or No."
  qwen_vl:
    pre_prompt: ""
    post_prompt: " Answer:"
metadata:
  - version: 0.0

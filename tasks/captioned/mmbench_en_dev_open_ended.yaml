# MMBench EN Dev — OPEN-ENDED visual variant
#
# Dataset: l11p/MMBench_EN-dev-captioned (image input retained)
# Scoring: exact match with VQAv2-style normalization against option text target

dataset_path: l11p/MMBench_EN-dev-captioned
dataset_kwargs:
  token: True
task: "mmbench_en_dev_open_ended"
test_split: train
output_type: generate_until
process_docs: !function utils.mmbench_normalize_columns
doc_to_visual: !function utils.single_image_doc_to_visual
doc_to_text: !function utils.mmbench_open_ended_doc_to_text
doc_to_target: !function utils.mmbench_open_ended_doc_to_target
generation_kwargs:
  until:
    - "ASSISTANT:"
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.mmbench_open_ended_process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer the question using a single word or phrase."
metadata:
  - version: 0.0

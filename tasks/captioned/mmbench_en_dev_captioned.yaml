# MMBench EN Dev — Captioned variant (text descriptions replace images)
#
# Dataset: l11p/MMBench_EN-dev-captioned (same as lmms-lab/MMBench EN dev + "caption" field)
# Scoring: Identical to original MMBench (GPT eval + submission)

dataset_path: l11p/MMBench_EN-dev-captioned
dataset_kwargs:
  token: True
task: "mmbench_en_dev_captioned"
test_split: train
output_type: generate_until
process_docs: !function utils.mmbench_normalize_columns
doc_to_visual: !function utils.captioned_doc_to_visual
doc_to_text: !function utils.mmbench_captioned_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  until:
    - "ASSISTANT:"
  max_new_tokens: 1024
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.mmbench_process_results
metric_list:
  - metric: gpt_eval_score
    aggregation: !function utils.mmbench_aggregate_dev_results_eval
    higher_is_better: true
  - metric: submission
    aggregation: !function utils.mmbench_aggregate_dev_results_submission
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly."
metadata:
  - version: 0.0

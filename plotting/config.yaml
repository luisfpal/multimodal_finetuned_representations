# Configuration for multimodal analysis results loader

# File paths - support multiple results directories
paths:
  results: "../results"

# Model name mappings
models:
  "llava-1.5-7b-hf": "finetuned"
  "llava-v1.5-mlp2x-336px-pretrain-vicuna-7b-v1.5": "pretrained"

# Available datasets
datasets:
  - "cocoqa_img"
  - "cocoqa_txt"
  - "coco_captioning"

# Analysis parameters
analysis:
  stream_types: ["output_layer", "post_mlp", "heads_projection"]
  pooling_methods: ["last", "mean", "none"]
  similarity_measures: ["neighborhood_overlap", "linear_cka", "svcca"]

  # Default parameters for intrinsic dimension analysis
  intrinsic_dimension_defaults:
    k: 16
    range_max: 100

# Modalities similarities configuration
modalities_similarities:
  datasets_with_modalities: ["coco_captioning", "cocoqa_img"]
  stream_types: ["output_layer", "post_mlp"]

# Caption benchmarking configuration
caption_benchmarking:
  directories:
    - "transplanting_layers_caption_benchmarking_max_new_tokens_100"
  experiment_types: ["sliding_window", "two_parts"]
